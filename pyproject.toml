[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-leash"
version = "0.9.0"
description = "Runtime permission firewall for MCP servers (stdio proxy)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Dan Calas"}]
keywords = ["mcp", "model-context-protocol", "security", "firewall", "proxy", "policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/mcp-leash"
Source = "https://github.com/calasdan-sketch/mcp-leash"
Issues = "https://github.com/calasdan-sketch/mcp-leash/issues"
Changelog = "https://github.com/calasdan-sketch/mcp-leash/blob/main/CHANGELOG.md"

[project.scripts]
mcp-leash = "mcp_leash.cli:main"
mcp-jail = "mcp_leash.cli:main"  # old name, kept as an alias

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_leash*"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv-sop"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
